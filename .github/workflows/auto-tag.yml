name: Auto Tag

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          # 获取最新的 tag
          LATEST_TAG=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Parse commit message and determine version bump
        id: version_bump
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"

          echo "Commit message: $COMMIT_MSG"
          echo "Latest tag: $LATEST_TAG"

          # 解析当前版本号
          MAJOR=$(echo $LATEST_TAG | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $LATEST_TAG | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | sed 's/v//' | cut -d. -f3)

          # 根据 commit message 决定版本递增类型
          if echo "$COMMIT_MSG" | grep -qiE "^(BREAKING CHANGE|MAJOR|breaking:)"; then
            # Major version bump
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qiE "^(feat|feature|MINOR)(\(.*\))?:"; then
            # Minor version bump
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -qiE "^(fix|bugfix|patch|chore|docs|style|refactor|perf|test)(\(.*\))?:"; then
            # Patch version bump
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          else
            # 默认递增 patch 版本
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "New tag will be: $NEW_TAG (bump type: $BUMP_TYPE)"

      - name: Check if tag already exists
        id: check_tag
        run: |
          NEW_TAG="${{ steps.version_bump.outputs.new_tag }}"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $NEW_TAG does not exist"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          NEW_TAG="${{ steps.version_bump.outputs.new_tag }}"
          BUMP_TYPE="${{ steps.version_bump.outputs.bump_type }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "chore: auto release $NEW_TAG ($BUMP_TYPE bump)"
          git push origin "$NEW_TAG"

          echo "Successfully created and pushed tag: $NEW_TAG"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_bump.outputs.new_tag }}
          release_name: Release ${{ steps.version_bump.outputs.new_tag }}
          body: |
            ## Changes in ${{ steps.version_bump.outputs.new_tag }}

            This is an automated release created by GitHub Actions.

            **Version Bump Type:** ${{ steps.version_bump.outputs.bump_type }}

            ### Commit Message
            ```
            ${{ github.event.head_commit.message }}
            ```

            ### Full Changelog
            https://github.com/${{ github.repository }}/compare/${{ steps.get_tag.outputs.latest_tag }}...${{ steps.version_bump.outputs.new_tag }}
          draft: false
          prerelease: false
